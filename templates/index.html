<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Mentor</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1> AI Mentor</h1>

        <p>Generate your personalized learning roadmap.</p>

        <form action="/generate-roadmap" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Your Email"
                required>

            <input
                type="text"
                name="skill"
                placeholder="Current Skill"
                required>

            <input
                type="text"
                name="goal"
                placeholder="Career Goal"
                required>

            <select name="experience">

                <option>Beginner</option>

                <option>Intermediate</option>

                <option>Advanced</option>

            </select>

            <input
                type="text"
                name="daily_time"
                placeholder="Daily Study Time (e.g. 2 Hours)"
                required>

            <input
                type="text"
                name="learning_style"
                placeholder="Learning Style"
                required>

            <textarea
                name="notes"
                rows="4"
                placeholder="Additional Notes"></textarea>

            <button type="submit">

                Generate Roadmap

            </button>

        </form>

    </div>

</div>

</body>

</html>
